spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres?currentSchema=markettest
    username: ${DB_USER:practicum_user}
    password: ${DB_PASSWORD:mysecretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    schemas: markettest
mymarket:
  catalog:
    file: "none"

