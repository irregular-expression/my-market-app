spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/postgres?schema=market
    username: ${DB_USER:practicum_user}
    password: ${DB_PASSWORD:mysecretpassword}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/postgres?currentSchema=market
    user: ${DB_USER:practicum_user}
    password: ${DB_PASSWORD:mysecretpassword}
    driver-class-name: org.postgresql.Driver
    schemas: market
  data:
    r2dbc:
      repositories:
        enabled: true
mymarket:
  catalog:
    file: "none"

